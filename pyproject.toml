[project]
name = "organize-me"
version = "0.1.0"
description = "Multi-modal content extraction and MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "rich>=13.7.0",
    "nltk>=3.8.1",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.2.0",
    "pytesseract>=0.3.10",
    "SpeechRecognition>=3.10.0",
    "faiss-cpu>=1.8.0",
    "open-clip-torch>=2.24.0",
    "torch>=2.2.0",
    "mcp>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "maturin>=1.5,<2",
]
